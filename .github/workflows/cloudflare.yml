# Setiap push ke main => minta Cloudflare Pages membangun ulang aplikasi (cadangan bila webhook Git Cloudflare tidak terpicu).
# Secret repo: CF_DEPLOY_HOOK = URL Deploy Hook dari Cloudflare (kashirot › Settings › Builds › Deploy hooks)
name: Deploy frontend (Cloudflare Pages)
on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', 'README.md']
  workflow_dispatch:
jobs:
  hook:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil Deploy Hook Cloudflare
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK belum diisi — dilewati"; exit 0; fi
          curl -fsS -X POST "$HOOK" && echo " => build Cloudflare diminta"
