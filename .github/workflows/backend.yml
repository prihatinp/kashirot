# Push ke backend/Code.gs => otomatis terpasang di Apps Script & Web App diperbarui (URL tetap sama).
# Secrets: GAS_REFRESH_TOKEN, GAS_SCRIPT_ID (opsional GAS_DEPLOYMENT_ID; default diambil dari config.js situs).
# Selama secrets belum ada, workflow DILEWATI (tetap hijau).
name: Deploy backend (Apps Script)
on:
  push:
    branches: [main]
    paths: ['backend/Code.gs', 'tools/gas-deploy.mjs']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ADA_KUNCI: ${{ secrets.GAS_REFRESH_TOKEN != '' && secrets.GAS_SCRIPT_ID != '' }}
    steps:
      - name: Cek kunci
        if: env.ADA_KUNCI != 'true'
        run: echo "::notice::Push otomatis backend belum dipasang - dilewati."
      - uses: actions/checkout@v4
        if: env.ADA_KUNCI == 'true'
      - uses: actions/setup-node@v4
        if: env.ADA_KUNCI == 'true'
        with: { node-version: 20 }
      - name: Pasang Code.gs & perbarui Web App
        if: env.ADA_KUNCI == 'true'
        run: node tools/gas-deploy.mjs
        env:
          GAS_REFRESH_TOKEN: ${{ secrets.GAS_REFRESH_TOKEN }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
